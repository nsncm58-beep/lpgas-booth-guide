<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>LPGas Show — Booth Guide</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#005C8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LPGas Guide">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue:        #005C8F;
  --blue-dark:   #00466E;
  --blue-deeper: #00304C;
  --blue-light:  #E8F1F7;
  --blue-mid:    #BCD6E5;
  --maroon:      #8B1538;
  --maroon-light:#F6E6EB;
  --green:       #2D7140;
  --green-light: #E9F4ED;
  --bg:          #F4F7FB;
  --surface:     #FFFFFF;
  --text:        #0E1B2C;
  --text-2:      #4A5A6E;
  --muted:       #8A98A8;
  --border:      #DCE4ED;
  --border-soft: #ECF1F6;
  --radius-lg:   14px;
  --radius-md:   10px;
  --radius-sm:   8px;
  --shadow:      0 1px 3px rgba(14,27,44,0.06), 0 4px 14px rgba(14,27,44,0.05);
  --shadow-sm:   0 1px 2px rgba(14,27,44,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
body {
  font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pop     { 0% { transform: scale(1); } 50% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* ── HEADER ── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--blue);
  color: #fff;
  box-shadow: 0 2px 16px rgba(0,40,70,0.22);
  padding-top: env(safe-area-inset-top, 0);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 4px;
  gap: 10px;
}
.logo-block { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-img {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  display: block;
  flex-shrink: 0;
}
.logo-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.logo-title {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 1.04rem;
  color: #fff;
  letter-spacing: 0.2px;
}
.logo-sub {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 1.7px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  margin-top: 2px;
}

.visit-counter { text-align: right; flex-shrink: 0; }
.vc-count {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  color: #fff;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: transform 0.2s;
}
.vc-count.pop { animation: pop 0.3s ease; }
.vc-label {
  font-size: 0.58rem;
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  margin-top: 4px;
}

.header-search {
  display: flex;
  gap: 8px;
  padding: 8px 12px 10px;
}
.search-wrap { flex: 1; position: relative; }
.search-wrap::before {
  content: "";
  position: absolute;
  left: 12px; top: 50%;
  width: 12px; height: 12px;
  margin-top: -7px;
  border: 1.8px solid rgba(255,255,255,0.55);
  border-radius: 50%;
  pointer-events: none;
}
.search-wrap::after {
  content: "";
  position: absolute;
  left: 22px; top: 50%;
  width: 6px; height: 1.8px;
  background: rgba(255,255,255,0.55);
  transform: rotate(45deg);
  margin-top: 3px;
  border-radius: 1px;
  pointer-events: none;
}
#searchInput {
  width: 100%;
  padding: 10px 14px 10px 34px;
  background: rgba(255,255,255,0.13);
  border: 1.5px solid rgba(255,255,255,0.22);
  border-radius: 10px;
  color: #fff;
  font-size: 0.92rem;
  font-family: inherit;
  outline: none;
  transition: background 0.2s, border-color 0.2s;
}
#searchInput::placeholder { color: rgba(255,255,255,0.55); font-weight: 500; }
#searchInput:focus { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }

.hdr-btn {
  padding: 0 14px;
  height: 40px;
  border: none;
  border-radius: 10px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.12s, opacity 0.12s, background 0.18s;
  -webkit-user-select: none; user-select: none;
}
.hdr-btn:active { transform: scale(0.94); opacity: 0.88; }
.btn-expand {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.25);
}
.btn-export {
  background: #fff;
  color: var(--blue-dark);
}
.btn-export:active { background: var(--blue-light); }

/* ── VIEW TABS (primary) ── */
.view-tabs {
  background: var(--surface);
  padding: 10px 12px 2px;
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--border-soft);
}
.view-tabs.no-border { border-bottom-color: transparent; }
.v-tab {
  flex: 1;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.2px;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  transition: background 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s;
  -webkit-user-select: none; user-select: none;
}
.v-tab:active { transform: scale(0.98); }
.v-tab.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,92,143,0.22);
}

/* ── FILTER BAR ── */
.filter-bar {
  background: var(--surface);
  padding: 9px 12px;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-bottom: 1px solid var(--border-soft);
  scrollbar-width: none;
}
.filter-bar.hidden { display: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.f-pill {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 0.76rem;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: 0.1px;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  transition: all 0.18s;
  -webkit-user-select: none; user-select: none;
}
.f-pill:active { transform: scale(0.95); }
.f-pill.active            { background: var(--blue);        border-color: var(--blue);        color: #fff; }
.f-pill.active.f-visited  { background: var(--green);       border-color: var(--green);       color: #fff; }
.f-pill.active.f-novisit  { background: var(--blue);        border-color: var(--blue);        color: #fff; }
.f-pill.active.f-customer { background: var(--green);       border-color: var(--green);       color: #fff; }
.f-pill.active.f-noncust  { background: var(--maroon);      border-color: var(--maroon);      color: #fff; }
.f-pill.active.f-unknown  { background: var(--text-2);      border-color: var(--text-2);      color: #fff; }

/* ── PROGRESS STRIP ── */
.progress-strip {
  height: 3px;
  background: var(--border-soft);
  position: relative;
  overflow: hidden;
}
.progress-strip .bar {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--green);
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  width: 0%;
}

/* ── CONTENT ── */
#content { padding: 8px 0 24px; min-height: calc(100vh - 220px); }

/* ── ROW SECTION ── */
.row-section {
  margin: 8px 10px 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: var(--surface);
  animation: fadeUp 0.3s ease both;
}
.row-section:last-child { margin-bottom: 10px; }
.row-header {
  background: var(--blue);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
  transition: background 0.18s;
}
.row-header.outdoor  { background: var(--maroon); }
.row-header.outdoor:active { background: #6e0f2b; }
.row-header:not(.outdoor):active { background: var(--blue-dark); }
.row-title {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  color: #fff;
  letter-spacing: 0.2px;
}
.row-right { display: flex; align-items: center; gap: 10px; }
.row-pill {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  background: rgba(255,255,255,0.18);
  color: #fff;
  font-variant-numeric: tabular-nums;
}
.row-pill.done { background: rgba(255,255,255,0.95); color: var(--blue-dark); }
.row-header.outdoor .row-pill.done { color: var(--maroon); }
.row-chevron {
  font-size: 0.55rem;
  color: rgba(255,255,255,0.7);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  font-family: inherit;
}
.row-chevron.open { transform: rotate(180deg); }

.row-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.32s cubic-bezier(0.4,0,0.2,1);
  background: var(--surface);
}
.row-body.open { grid-template-rows: 1fr; }
.row-body-inner { overflow: hidden; }

/* ── COMPANY CARD ── */
.co-card {
  padding: 13px 15px 13px 18px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
  transition: background 0.18s;
  position: relative;
}
.co-card:last-child { border-bottom: none; }
.co-card::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: transparent;
  transition: background 0.22s;
}
.co-card.visited::before  { background: var(--green); }
.co-card.s-customer::before { background: var(--blue); }
.co-card.visited.s-customer::before { background: var(--green); }
.co-card.s-noncustomer::before { background: var(--maroon); }
.co-card.visited { background: #F6FBF8; }

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.co-name {
  flex: 1;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
  min-width: 0;
  word-break: break-word;
}
.booth-badge {
  flex-shrink: 0;
  background: var(--blue-light);
  color: var(--blue-dark);
  border: 1px solid var(--blue-mid);
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.3px;
  font-variant-numeric: tabular-nums;
}
.booth-badge.outdoor {
  background: var(--maroon-light);
  color: var(--maroon);
  border-color: #E8C0CC;
}
.sched-tag {
  flex-shrink: 0;
  background: var(--blue-deeper);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.3px;
  font-variant-numeric: tabular-nums;
}

/* ── ACTION ROW ── */
.card-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.notes-btn, .visit-btn {
  padding: 0 12px;
  height: 32px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 0.74rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-user-select: none; user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.notes-btn:active, .visit-btn:active { transform: scale(0.94); }
.notes-btn.on {
  border-color: var(--blue);
  color: var(--blue);
  background: var(--blue-light);
}
.visit-btn.on {
  border-color: var(--green);
  color: var(--green);
  background: var(--green-light);
}
.visit-btn .dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
  position: relative;
}
.visit-btn.on .dot { background: var(--green); border-color: var(--green); }
.visit-btn.on .dot::after {
  content: "";
  position: absolute;
  left: 3px; top: 3px;
  width: 6px; height: 3.5px;
  border-left: 1.8px solid #fff;
  border-bottom: 1.8px solid #fff;
  transform: rotate(-45deg) translate(0,-1px);
}

/* Status segmented */
.status-group {
  display: inline-flex;
  border-radius: 8px;
  overflow: hidden;
  border: 1.5px solid var(--border);
  height: 32px;
  flex-shrink: 0;
}
.status-btn {
  padding: 0 10px;
  border: none;
  border-right: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.7rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  -webkit-user-select: none; user-select: none;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
}
.status-btn:last-child { border-right: none; }
.status-btn:active { opacity: 0.78; }
.status-btn.s-cust.active { background: var(--green);  color: #fff; }
.status-btn.s-non.active  { background: var(--maroon); color: #fff; }
.status-btn.s-unk.active  { background: var(--blue-mid); color: var(--blue-deeper); }

/* Schedule select */
.sched-sel {
  padding: 0 26px 0 10px;
  height: 32px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background-color: var(--surface);
  font-size: 0.73rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--text-2);
  cursor: pointer;
  max-width: 175px;
  transition: border-color 0.15s, background-color 0.15s, color 0.15s;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%234A5A6E' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 9px center;
}
.sched-sel.scheduled {
  border-color: var(--blue);
  color: var(--blue);
  background-color: var(--blue-light);
}

/* ── NOTES PANEL ── */
.notes-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.28s cubic-bezier(0.4,0,0.2,1);
}
.notes-panel.open { grid-template-rows: 1fr; }
.notes-panel-inner { overflow: hidden; }
.notes-content {
  padding: 12px 0 2px;
  border-top: 1px dashed var(--border);
  margin-top: 12px;
}
.note-group { margin-bottom: 10px; }
.note-group:last-child { margin-bottom: 0; }
.note-label {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.note-label.pre  { color: var(--blue); }
.note-label.post { color: var(--green); }

textarea.nf {
  width: 100%;
  min-height: 64px;
  padding: 9px 11px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--text);
  background: #FBFCFE;
  resize: vertical;
  line-height: 1.45;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
textarea.nf:focus { outline: none; background: #fff; }
textarea.nf.pre:focus  { border-color: var(--blue);  box-shadow: 0 0 0 3px rgba(0,92,143,0.10); }
textarea.nf.post:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(45,113,64,0.10); }

/* ── EMPTY STATE ── */
.empty-wrap {
  padding: 64px 28px 40px;
  text-align: center;
  animation: fadeIn 0.3s ease;
}
.empty-wrap h3 {
  font-family: 'Nunito', sans-serif;
  font-size: 1.16rem;
  color: var(--text);
  margin-bottom: 6px;
  font-weight: 800;
}
.empty-wrap p {
  font-size: 0.84rem;
  color: var(--muted);
  line-height: 1.55;
  max-width: 280px;
  margin: 0 auto;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  opacity: 0;
  background: var(--blue-deeper);
  color: #fff;
  padding: 11px 22px;
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 600;
  z-index: 900;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,30,52,0.32);
  white-space: nowrap;
  transition: transform 0.3s cubic-bezier(0.34,1.4,0.64,1), opacity 0.25s;
  max-width: calc(100% - 32px);
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── UPDATE BANNER ── */
#update-banner {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 600;
  background: var(--blue-deeper);
  color: #fff;
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0));
  text-align: center;
  font-size: 0.86rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border-top: 2px solid rgba(255,255,255,0.18);
  display: none;
  -webkit-user-select: none; user-select: none;
}
#update-banner.show { display: block; animation: fadeUp 0.35s ease; }
.ub-action {
  display: inline-block;
  margin-left: 12px;
  background: rgba(255,255,255,0.22);
  border-radius: 6px;
  padding: 3px 11px;
  font-size: 0.78rem;
}

/* ── FOOTER ── */
.app-footer {
  padding: 18px 16px calc(36px + env(safe-area-inset-bottom, 0));
  text-align: center;
  color: var(--muted);
  font-size: 0.7rem;
  line-height: 1.7;
}

/* ── SCHEDULE VIEW ── */
.sched-day-tabs {
  display: flex;
  gap: 6px;
  padding: 10px 10px 4px;
}
.sched-day-tab {
  flex: 1;
  padding: 9px 4px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: inherit;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-user-select: none; user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  box-shadow: var(--shadow-sm);
}
.sched-day-tab .stdt-day {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.88rem;
  letter-spacing: 0.2px;
}
.sched-day-tab .stdt-count {
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.sched-day-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.sched-day-tab.active .stdt-count { color: rgba(255,255,255,0.8); }
.sched-day-tab:active { opacity: 0.85; }

.sched-search-box {
  margin: 8px 10px 6px;
  background: var(--surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  padding: 10px 12px;
  border: 1px solid var(--border-soft);
}
.sched-search-input {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--text);
  background: #FBFCFE;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.sched-search-input:focus { border-color: var(--blue); background: #fff; }
.sched-results { margin-top: 6px; }
.sched-result-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border-soft);
}
.sched-result-row:last-child { border-bottom: none; }
.sched-result-name {
  flex: 1;
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--text);
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.sched-result-meta { font-size: 0.66rem; color: var(--muted); font-weight: 500; margin-top: 2px; }
.sched-result-booth {
  font-size: 0.68rem;
  color: var(--muted);
  font-weight: 700;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.sched-add-sel {
  padding: 0 22px 0 9px;
  height: 30px;
  border-radius: 7px;
  border: 1.5px solid var(--blue);
  background-color: var(--blue-light);
  color: var(--blue-dark);
  font-size: 0.7rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2300466E' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 6px center;
}

/* Time slot rows */
.time-slot { margin: 0 10px 4px; }
.time-slot-hdr {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 2px 6px;
}
.time-lbl {
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--text-2);
  min-width: 64px;
  font-family: 'Nunito', sans-serif;
  white-space: nowrap;
  letter-spacing: 0.2px;
  font-variant-numeric: tabular-nums;
}
.time-line { flex: 1; height: 1px; background: var(--border); }
.sched-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 11px 13px;
  margin-bottom: 5px;
  box-shadow: var(--shadow-sm);
  border-left: 3px solid var(--blue);
  animation: fadeUp 0.2s ease both;
}
.sched-card.visited { border-left-color: var(--green); background: #F6FBF8; }
.sched-card-info { flex: 1; min-width: 0; }
.sched-card-name {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sched-card-booth {
  font-size: 0.7rem;
  color: var(--muted);
  font-weight: 600;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.sched-rm-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 1.15rem;
  line-height: 1;
  font-weight: 400;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-user-select: none; user-select: none;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.sched-rm-btn:active { background: var(--maroon-light); color: var(--maroon); border-color: var(--maroon); }

/* Full card embedded in a schedule time slot */
.sched-slot-card {
  margin: 0 0 10px;
  animation: fadeUp 0.2s ease both;
}
.sched-slot-card .co-card { margin-bottom: 0; }
.sched-rm-link {
  display: block;
  margin: 4px auto 0;
  padding: 6px 12px;
  background: none;
  border: none;
  color: var(--maroon);
  font-size: 0.72rem;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  cursor: pointer;
}
.sched-rm-link:active { color: var(--text); }

.sched-empty {
  padding: 36px 22px 22px;
  text-align: center;
  color: var(--muted);
  animation: fadeIn 0.3s ease;
}
.sched-empty h4 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.02rem; color: var(--text); margin-bottom: 6px; }
.sched-empty p { font-size: 0.81rem; line-height: 1.55; max-width: 300px; margin: 0 auto; }
</style>

const TIME_SLOTS = (() => {
  const out = [];
  for (let m = 7*60; m <= 18*60; m += 30) {
    const h = Math.floor(m/60), mn = m%60;
    const ampm = h >= 12 ? "PM" : "AM";
    const dh = h > 12 ? h-12 : h;
    out.push(`${dh}:${mn===0?"00":"30"} ${ampm}`);
  }
  return out;
})();

// STATE — key intentionally preserved as lpgas_v3 so existing user data carries forward.
const STORE = "lpgas_v3";
const load  = () => { try { return JSON.parse(localStorage.getItem(STORE)||"{}"); } catch(e){ return {}; } };
const save  = s  => { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch(e){} };
const key   = i  => "c"+i;

function rowKey(b) {
  if (typeof b==="string" && b[0]==="T")
    return "T"+(Math.floor(parseInt(b.slice(1))/100)*100);
  return String(Math.floor(parseInt(b)/100)*100);
}
function rowOrder(rk) { return rk[0]==="T" ? 100000+parseInt(rk.slice(1)) : parseInt(rk); }
function rowLabel(rk) { return rk[0]==="T" ? "Outdoor — Row "+rk.slice(1)+"s" : "Row "+rk+"s"; }
function isOutdoor(rk){ return rk[0]==="T"; }

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

let activeView   = "booths";   // "booths" | "schedule"
let activeFilter = "all";
let allOpen      = false;
let schedSearchQ = "";
let schedDay     = 1;

function buildCard(c, state) {
  const s = state[key(c.i)] || {};
  const visited   = !!s.visited;
  const hasNotes  = !!(s.pre || s.post);
  const status    = s.status || "unknown";
  const scheduled = s.scheduled || null;
  const outdoor   = isOutdoor(rowKey(c.b));
  const npId      = "np"+c.i;
  const statusCls = status === "customer" ? " s-customer"
                  : status === "noncustomer" ? " s-noncustomer" : "";
  const schedTag = scheduled
    ? `<span class="sched-tag">D${scheduled.split("|")[0]} ${esc(scheduled.split("|")[1])}</span>`
    : "";
  const timeOpts = [1,2,3].map(d =>
    `<optgroup label="Day ${d}">${TIME_SLOTS.map(t =>
      `<option value="${d}|${esc(t)}"${scheduled===`${d}|${t}`?" selected":""}>Day ${d} · ${t}</option>`
    ).join("")}</optgroup>`
  ).join("");
  return `
    <div class="co-card${visited?" visited":""}${statusCls}" id="cc${c.i}" data-i="${c.i}">
      <div class="card-top">
        <span class="co-name">${esc(c.n)}</span>
        ${schedTag}
        <span class="booth-badge${outdoor?" outdoor":""}">Booth ${esc(c.b)}</span>
      </div>
      <div class="card-actions">
        <button class="visit-btn${visited?" on":""}" data-visit="${c.i}">
          <span class="dot"></span>${visited?"Visited":"Mark Visit"}
        </button>
        <button class="notes-btn${hasNotes?" on":""}" data-np="${npId}">${hasNotes?"Notes":"Add Notes"}</button>
        <div class="status-group">
          <button class="status-btn s-cust${status==="customer"?" active":""}" data-si="${c.i}" data-sval="customer">Customer</button>
          <button class="status-btn s-non${status==="noncustomer"?" active":""}" data-si="${c.i}" data-sval="noncustomer">Non-Cust</button>
          <button class="status-btn s-unk${status==="unknown"?" active":""}" data-si="${c.i}" data-sval="unknown">Unsure</button>
        </div>
        <select class="sched-sel${scheduled?" scheduled":""}" data-sched="${c.i}" title="Schedule">
          <option value="">Schedule…</option>
          ${timeOpts}
        </select>
      </div>
      <div class="notes-panel${hasNotes?" open":""}" id="${npId}">
        <div class="notes-panel-inner"><div class="notes-content">
          <div class="note-group">
            <div class="note-label pre">Pre-Visit</div>
            <textarea class="nf pre" data-i="${c.i}" data-f="pre" placeholder="Background, talking points, what to ask…">${esc(s.pre||"")}</textarea>
          </div>
          <div class="note-group">
            <div class="note-label post">Post-Visit</div>
            <textarea class="nf post" data-i="${c.i}" data-f="post" placeholder="What was discussed, follow-ups, impressions…">${esc(s.post||"")}</textarea>
          </div>
        </div></div>
      </div>
    </div>`;
}

function render() {
  const state = load();
  const q = document.getElementById("searchInput").value.trim().toLowerCase();

  let list = CO.map((c,i)=>({...c,i}));
  if (q) list = list.filter(c => c.n.toLowerCase().includes(q) || c.b.toLowerCase().includes(q));
  if (activeFilter==="visited")     list = list.filter(c => state[key(c.i)]?.visited);
  if (activeFilter==="novisit")     list = list.filter(c => !state[key(c.i)]?.visited);
  if (activeFilter==="customer")    list = list.filter(c => state[key(c.i)]?.status==="customer");
  if (activeFilter==="noncustomer") list = list.filter(c => state[key(c.i)]?.status==="noncustomer");
  if (activeFilter==="unknown")     list = list.filter(c => !state[key(c.i)]?.status || state[key(c.i)]?.status==="unknown");

  const el = document.getElementById("content");
  const filterBar = document.querySelector(".filter-bar");

  if (activeView === "schedule") {
    filterBar?.classList.add("hidden");
    renderScheduleView(state);
    return;
  }
  filterBar?.classList.remove("hidden");

  if (!list.length) {
    const msgs = {
      visited:     ["No visits yet","Mark booths as visited as you walk the floor."],
      novisit:     ["All caught up","Every company in this view has been visited."],
      customer:    ["No customers tagged","Tap Customer on a card to flag accounts you own."],
      noncustomer: ["No non-customers tagged","Tap Non-Cust to mark booths you can skip."],
      unknown:     ["Every company classified","All booths have a customer status set."],
    };
    const [title, sub] = msgs[activeFilter] || ["No results","Try a different search term."];
    el.innerHTML = `<div class="empty-wrap"><h3>${title}</h3><p>${sub}</p></div>`;
    updateStats(state);
    return;
  }

  const groups = {};
  list.forEach(c => {
    const rk = rowKey(c.b);
    (groups[rk] = groups[rk]||[]).push(c);
  });
  Object.values(groups).forEach(a => a.sort((x,y) => x.n.localeCompare(y.n)));
  const rowKeys = Object.keys(groups).sort((a,b) => rowOrder(a) - rowOrder(b));

  let html = "";
  rowKeys.forEach((rk, ri) => {
    const comps = groups[rk];
    const outdoor = isOutdoor(rk);
    const nVisited = comps.filter(c => state[key(c.i)]?.visited).length;
    const pillCls  = nVisited===comps.length && comps.length>0 ? "row-pill done" : "row-pill";
    const bodyId = "rb"+rk.replace(/\W/g,"_");
    html += `
<div class="row-section" data-rk="${esc(rk)}" style="animation-delay:${Math.min(ri*0.03,0.3)}s">
  <div class="row-header${outdoor?" outdoor":""}" data-toggle="${bodyId}">
    <span class="row-title">${esc(rowLabel(rk))}</span>
    <span class="row-right">
      <span class="${pillCls}" id="badge_${esc(rk)}">${nVisited}/${comps.length}</span>
      <span class="row-chevron${allOpen?" open":""}">▾</span>
    </span>
  </div>
  <div class="row-body${allOpen?" open":""}" id="${bodyId}"><div class="row-body-inner">`;
    comps.forEach(c => { html += buildCard(c, state); });
    html += `</div></div></div>`;
  });

  el.innerHTML = html;
  updateStats(state);
}

function renderScheduleView(state) {
  const el = document.getElementById("content");
  const dayCount = [0,0,0,0];
  CO.forEach((c,i) => {
    const sv = state[key(i)]?.scheduled;
    if (!sv) return;
    const d = parseInt(sv.split("|")[0]);
    if (d>=1 && d<=3) dayCount[d]++;
  });
  const dayTabs = [1,2,3].map(d => `
    <button class="sched-day-tab${schedDay===d?" active":""}" data-day="${d}">
      <span class="stdt-day">Day ${d}</span>
      <span class="stdt-count">${dayCount[d]} booked</span>
    </button>`).join("");

  const searchHtml = (() => {
    if (!schedSearchQ) return "";
    const matches = CO.map((c,i)=>({...c,i}))
      .filter(c => c.n.toLowerCase().includes(schedSearchQ) || c.b.toLowerCase().includes(schedSearchQ))
      .slice(0,8);
    if (!matches.length)
      return `<div style="padding:8px 0 2px;color:var(--muted);font-size:0.8rem;">No matches.</div>`;
    return matches.map(c => {
      const cur = state[key(c.i)]?.scheduled || null;
      const meta = cur ? `Currently Day ${cur.split("|")[0]} · ${cur.split("|")[1]}` : "";
      return `
        <div class="sched-result-row">
          <span class="sched-result-name">${esc(c.n)}${meta?`<span class="sched-result-meta">${meta}</span>`:""}</span>
          <span class="sched-result-booth">${esc(c.b)}</span>
          <select class="sched-add-sel" data-add-i="${c.i}">
            <option value="">+ Time</option>
            ${TIME_SLOTS.map(t => `<option value="${esc(t)}">${t}</option>`).join("")}
          </select>
        </div>`;
    }).join("");
  })();

  const byTime = {};
  CO.forEach((c,i) => {
    const sv = state[key(i)]?.scheduled;
    if (!sv) return;
    const [d,t] = sv.split("|");
    if (parseInt(d) === schedDay) (byTime[t] = byTime[t]||[]).push({...c,i});
  });
  const hasAny = Object.keys(byTime).length > 0;

  let html = `
<div class="sched-day-tabs">${dayTabs}</div>
<div class="sched-search-box">
  <input class="sched-search-input" type="text" placeholder="Search to add to Day ${schedDay}" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(schedSearchQ)}">
  <div class="sched-results" id="sched-results">${searchHtml}</div>
</div>`;

  if (!hasAny) {
    html += `<div class="sched-empty">
      <h4>Nothing booked on Day ${schedDay}</h4>
      <p>Search above to add a company, or use the Schedule dropdown on any booth card.</p>
    </div>`;
  } else {
    TIME_SLOTS.forEach(t => {
      const comps = byTime[t] || [];
      if (!comps.length) return;
      html += `<div class="time-slot">
        <div class="time-slot-hdr"><span class="time-lbl">${t}</span><span class="time-line"></span></div>`;
      comps.forEach(c => {
        html += `<div class="sched-slot-card">${buildCard(c, state)}<button class="sched-rm-link" data-rm="${c.i}">Remove from Day ${schedDay}</button></div>`;
      });
      html += `</div>`;
    });
  }
  el.innerHTML = html;
  if (schedSearchQ) document.querySelector(".sched-search-input")?.focus();
  updateStats(state);
}

function updateStats(state) {
  const total = CO.length;
  const vis = Object.values(state).filter(s => s?.visited).length;
  const pct = total > 0 ? (vis/total)*100 : 0;
  const hv  = document.getElementById("hdrVisited");
  const text = `${vis} / ${total}`;
  if (hv && hv.textContent !== text) {
    hv.textContent = text;
    hv.classList.remove("pop");
    void hv.offsetWidth;
    hv.classList.add("pop");
  }
  const bar = document.getElementById("progBar");
  if (bar) bar.style.width = pct + "%";
}

function refreshBadge(rk, state) {
  const badge = document.getElementById("badge_"+rk);
  const sec   = document.querySelector(`[data-rk="${CSS.escape(rk)}"]`);
  if (!badge || !sec) return;
  const cards = sec.querySelectorAll(".co-card");
  let vis = 0;
  cards.forEach(c => { if (state[key(parseInt(c.dataset.i))]?.visited) vis++; });
  badge.textContent = vis+"/"+cards.length;
  badge.className = vis===cards.length && cards.length>0 ? "row-pill done" : "row-pill";
}

let _dt = {};

document.getElementById("content").addEventListener("click", e => {
  const state = load();

  const tog = e.target.closest("[data-toggle]");
  if (tog) {
    const body = document.getElementById(tog.getAttribute("data-toggle"));
    body?.classList.toggle("open");
    tog.querySelector(".row-chevron")?.classList.toggle("open");
    return;
  }

  const npBtn = e.target.closest("[data-np]");
  if (npBtn) {
    const panel = document.getElementById(npBtn.dataset.np);
    if (!panel) return;
    panel.classList.toggle("open");
    const on = panel.classList.contains("open");
    npBtn.classList.toggle("on", on);
    if (on) panel.querySelector("textarea")?.focus();
    return;
  }

  const dayTab = e.target.closest("[data-day]");
  if (dayTab) {
    schedDay = parseInt(dayTab.dataset.day);
    schedSearchQ = "";
    render();
    return;
  }

  const rmBtn = e.target.closest("[data-rm]");
  if (rmBtn) {
    const i = parseInt(rmBtn.dataset.rm);
    const k = key(i);
    if (state[k]) state[k].scheduled = null;
    save(state);
    toast("Removed from schedule");
    render();
    return;
  }

  const statBtn = e.target.closest("[data-sval]");
  if (statBtn) {
    const i = parseInt(statBtn.dataset.si);
    const val = statBtn.dataset.sval;
    const k = key(i);
    if (!state[k]) state[k] = {};
    state[k].status = (state[k].status === val && val !== "unknown") ? "unknown" : val;
    save(state);
    const ns = state[k].status;
    const grp = statBtn.closest(".status-group");
    grp.querySelectorAll(".status-btn").forEach(b => b.classList.toggle("active", b.dataset.sval===ns));
    const card = document.getElementById("cc"+i);
    card.classList.remove("s-customer","s-noncustomer");
    if (ns!=="unknown") card.classList.add("s-"+ns);
    const label = ns==="customer" ? "Marked as Customer"
                : ns==="noncustomer" ? "Marked as Non-Customer"
                : "Status cleared";
    toast(label);
    return;
  }

  const visBtn = e.target.closest("[data-visit]");
  if (visBtn) {
    const i = parseInt(visBtn.dataset.visit);
    const k = key(i);
    if (!state[k]) state[k] = {};
    state[k].visited = !state[k].visited;
    save(state);
    const on = state[k].visited;
    visBtn.classList.toggle("on", on);
    visBtn.innerHTML = `<span class="dot"></span>${on?"Visited":"Mark Visit"}`;
    const card = document.getElementById("cc"+i);
    card?.classList.toggle("visited", on);
    const rk = card?.closest("[data-rk]")?.dataset.rk;
    if (rk) refreshBadge(rk, state);
    updateStats(state);
    if (on) toast("Marked as visited");
    return;
  }
});

document.getElementById("content").addEventListener("input", e => {
  if (e.target.classList.contains("sched-search-input")) {
    schedSearchQ = e.target.value.trim().toLowerCase();
    const state = load();
    const matches = schedSearchQ
      ? CO.map((c,i)=>({...c,i})).filter(c => c.n.toLowerCase().includes(schedSearchQ) || c.b.toLowerCase().includes(schedSearchQ)).slice(0,8)
      : [];
    const rEl = document.getElementById("sched-results");
    if (!rEl) return;
    if (!schedSearchQ) { rEl.innerHTML = ""; return; }
    if (!matches.length) { rEl.innerHTML = `<div style="padding:8px 0 2px;color:var(--muted);font-size:0.8rem;">No matches.</div>`; return; }
    rEl.innerHTML = matches.map(c => {
      const cur = state[key(c.i)]?.scheduled || null;
      const meta = cur ? `Currently Day ${cur.split("|")[0]} · ${cur.split("|")[1]}` : "";
      return `
        <div class="sched-result-row">
          <span class="sched-result-name">${esc(c.n)}${meta?`<span class="sched-result-meta">${meta}</span>`:""}</span>
          <span class="sched-result-booth">${esc(c.b)}</span>
          <select class="sched-add-sel" data-add-i="${c.i}">
            <option value="">+ Time</option>
            ${TIME_SLOTS.map(t => `<option value="${esc(t)}">${t}</option>`).join("")}
          </select>
        </div>`;
    }).join("");
    return;
  }
  if (!e.target.classList.contains("nf")) return;
  const i = parseInt(e.target.dataset.i);
  const f = e.target.dataset.f;
  const v = e.target.value;
  clearTimeout(_dt[i+f]);
  _dt[i+f] = setTimeout(() => {
    const state = load();
    const k = key(i);
    if (!state[k]) state[k] = {};
    state[k][f] = v;
    save(state);
    const card = document.getElementById("cc"+i);
    const btn  = card?.querySelector("[data-np]");
    if (btn && (state[k].pre || state[k].post)) {
      btn.textContent = "Notes";
      btn.classList.add("on");
    }
  }, 480);
});

    const i = parseInt(sel.dataset.sched);
    const v = sel.value;
    const k = key(i);
    const state = load();
    if (!state[k]) state[k] = {};
    state[k].scheduled = v || null;
    save(state);
    sel.classList.toggle("scheduled", !!v);
    if (v) { const [d,t] = v.split("|"); toast(`Day ${d} · ${t}`); }
    else toast("Removed from schedule");
    render();
    return;
  }
  const addSel = e.target.closest(".sched-add-sel");
  if (addSel) {
    const t = addSel.value;
    if (!t) return;
    const i = parseInt(addSel.dataset.addI);
    const k = key(i);
    const state = load();
    if (!state[k]) state[k] = {};
    state[k].scheduled = `${schedDay}|${t}`;
    save(state);
    schedSearchQ = "";
    toast(`Day ${schedDay} · ${t}`);
    render();
    return;
  }
});

document.querySelector(".view-tabs").addEventListener("click", e => {
  const tab = e.target.closest(".v-tab");
  if (!tab) return;
  document.querySelectorAll(".v-tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  activeView = tab.dataset.v;
  render();
});

document.querySelector(".filter-bar").addEventListener("click", e => {
  const pill = e.target.closest(".f-pill");
  if (!pill) return;
  document.querySelectorAll(".f-pill").forEach(p => p.classList.remove("active"));
  pill.classList.add("active");
  activeFilter = pill.dataset.f;
  render();
});

let _st;
document.getElementById("searchInput").addEventListener("input", () => {
  clearTimeout(_st);
  _st = setTimeout(render, 180);
});

document.getElementById("expandBtn").addEventListener("click", function () {
  allOpen = !allOpen;
  document.querySelectorAll(".row-body").forEach(b => b.classList.toggle("open", allOpen));
  document.querySelectorAll(".row-chevron").forEach(c => c.classList.toggle("open", allOpen));
  this.textContent = allOpen ? "Collapse" : "Expand";
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const state = load();
  const rows = [["Company","Booth","Row","Customer Status","Scheduled Day","Scheduled Time","Visited","Pre-Visit Notes","Post-Visit Notes"]];
  [...CO].map((c,i) => ({...c,i}))
    .sort((a,b) => a.n.localeCompare(b.n))
    .forEach(c => {
      const s = state[key(c.i)] || {};
      const rk = rowKey(c.b);
      const st = s.status==="customer" ? "Existing Customer"
               : s.status==="noncustomer" ? "Non-Customer" : "Unknown";
      const [schedD, schedT] = s.scheduled ? s.scheduled.split("|") : ["",""];
      rows.push([c.n, c.b,
        isOutdoor(rk) ? "Outdoor T"+rk.slice(1)+"s" : "Row "+rk+"s",
        st, schedD ? "Day "+schedD : "", schedT||"",
        s.visited ? "Yes" : "No", s.pre||"", s.post||""]);
    });
  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), {href:url, download:"LPGas_BoothNotes.csv"});
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast("CSV downloaded");
});

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2400);
}

if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController) {
      const banner = document.getElementById("update-banner");
      banner.classList.add("show");
      banner.addEventListener("click", () => window.location.reload(), {once:true});
    }
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      if (reg.waiting && hadController) {
        const banner = document.getElementById("update-banner");
        banner.classList.add("show");
        banner.addEventListener("click", () => {
          reg.waiting.postMessage({type:"SKIP_WAITING"});
        }, {once:true});
      }
    }).catch(() => {});
  });
}

render();

</script>
</body>
</html>
